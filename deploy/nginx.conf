# Nginx 反向代理 + HTTPS 模板
# 把它放到 /etc/nginx/sites-available/zhipin，再软链到 sites-enabled 启用。
#
# 作用：外网用 https://api.你的域名.com 访问，Nginx 把请求转给本机 127.0.0.1:8080 的后端。
# 好处：加密传输（token 不再明文）、隐藏后端端口、方便配证书。
#
# 前置条件：
#   1. 你有一个域名，且已把它的 A 记录解析到这台服务器的公网 IP。
#   2. 已装 nginx：sudo apt install -y nginx
#   3. 后端在跑（systemd，监听 127.0.0.1:8080）。

# ── 第一步：先只配 HTTP，让 certbot 能签证书 ──
# 先用下面这段（80 端口）跑通，再执行 certbot，certbot 会自动把它改写成含 443 的 HTTPS 版本。
server {
    listen 80;
    server_name api.你的域名.com;      # ← 改成你的域名

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 说明：执行 certbot 后（见 DEPLOY.md），它会自动生成类似下面的 443 配置 ──
