<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人才库</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    .filter-bar { display: flex; gap: 8px; margin-bottom: var(--space-4); }
    .filter-bar .input { flex: 1; }
    .filter-select { padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--text-xs); background: var(--bg); color: var(--fg); font-family: inherit; }
    .filter-select:focus { outline: none; border-color: var(--accent); }

    .talent-list { display: flex; flex-direction: column; gap: 10px; }
    .talent-item { background: var(--surface); border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--border-soft); transition: border-color 0.2s; }
    .talent-item:hover { border-color: var(--border); }
    .talent-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .talent-name { font-weight: 600; font-size: 15px; }
    .badge-boss { background: var(--accent-bg); color: var(--accent); }
    .badge-manual { background: var(--border-soft); color: var(--muted); }
    .talent-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .talent-phone { font-size: 13px; margin-bottom: 3px; }
    .talent-phone.empty { color: var(--meta); }
    .talent-email { font-size: 12px; color: var(--muted); margin-bottom: 10px; overflow-wrap: anywhere; }

    .talent-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-soft); }
    .btn-call { font-size: 12px; padding: 6px 14px; }
    .btn-call:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-whobot { font-size: 12px; padding: 6px 12px; }
    .btn-whobot.submitted { color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, transparent); }
    .btn-whobot:disabled { opacity: 0.55; cursor: wait; }
    .btn-whobot.loading::before { content: ""; width: 11px; height: 11px; margin-right: 6px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: whobot-spin 0.8s linear infinite; }
    .action-group { display: flex; gap: 12px; }
    .action-icon { color: var(--muted); cursor: pointer; font-size: 12px; }
    .action-icon:hover { color: var(--fg); }
    .action-icon.danger:hover { color: var(--danger); }
    .action-icon.info:hover { color: var(--accent); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal { background: var(--bg); width: 90%; max-width: 340px; border-radius: var(--radius-lg); padding: 20px; max-height: 85vh; overflow-y: auto; }
    .modal-title { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }
    button:focus-visible, .action-icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @keyframes whobot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .talent-item, #toast, .btn-whobot.loading::before { transition: none; animation: none; }
    }
    @media (max-width: 620px) {
      .action-bar, .filter-bar { align-items: stretch; flex-direction: column; }
      .action-bar > div { justify-content: flex-end; }
      .field-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="panel-content">
    <div class="action-bar">
      <h3 style="font-size:15px;font-weight:600;margin:0" id="talentTitle">人才库</h3>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary" style="font-size:12px;padding:6px 14px" id="btnExportCsv">导出CSV</button>
        <button class="btn btn-primary" style="font-size:12px;padding:6px 14px" id="btnAddTalent">+ 手动录入</button>
      </div>
    </div>

    <div class="filter-bar">
      <input class="input" id="searchInput" placeholder="搜索姓名 / 电话 / 邮箱 / 岗位" />
      <select class="filter-select" id="sourceFilter">
        <option value="all">全部来源</option>
        <option value="manual">手动录入</option>
        <option value="boss">Boss采集</option>
      </select>
    </div>

    <div class="talent-list" id="talentList"></div>
    <div id="emptyState" style="text-align:center;padding:40px 20px;color:var(--muted);display:none">
      <div style="font-size:40px;margin-bottom:12px;opacity:0.4">👥</div>
      <p style="margin:0">暂无人才记录</p>
      <p style="font-size:12px;margin-top:6px">可手动录入，或在「简历采集」页开始采集</p>
    </div>

  </div>

  <!-- 新增/编辑/详情弹窗 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h4 class="modal-title" id="editModalTitle">手动录入</h4>
      <div class="field">
        <label>姓名 *</label>
        <input class="input" id="fName" placeholder="候选人姓名" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>年龄</label>
          <input class="input" id="fAge" type="number" min="16" max="80" placeholder="如 28" />
        </div>
        <div class="field">
          <label>性别</label>
          <select class="filter-select" id="fGender" style="width:100%;height:38px">
            <option value="">未填写</option>
            <option value="女">女</option>
            <option value="男">男</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>电话</label>
          <input class="input" id="fPhone" placeholder="手机号码" />
        </div>
        <div class="field">
          <label>城市</label>
          <input class="input" id="fCity" placeholder="现居城市" />
        </div>
      </div>
      <div class="field">
        <label>邮箱</label>
        <input class="input" id="fEmail" type="email" placeholder="候选人邮箱" />
      </div>
      <div class="field">
        <label>应聘岗位</label>
        <input class="input" id="fPosition" placeholder="如 前端开发工程师" />
      </div>
      <div class="field">
        <label>岗位 JD</label>
        <textarea class="textarea" id="fJobDescription" style="min-height:72px" placeholder="填写岗位职责、任职要求等"></textarea>
      </div>
      <div class="field">
        <label>电话待确认</label>
        <input class="input" id="fPendingConfirmation" placeholder="如：请确认该号码是否为本人常用电话" />
      </div>
      <div class="field">
        <label>岗位特殊说明</label>
        <textarea class="textarea" id="fSpecialNotes" style="min-height:60px" placeholder="如：必须接受出差、优先北京到岗"></textarea>
      </div>
      <div class="field">
        <label>使用人员</label>
        <input class="input" id="fEndUser" placeholder="负责使用回调结果的 HR / 客户名称" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>学历</label>
          <input class="input" id="fEducation" placeholder="如 本科" />
        </div>
        <div class="field">
          <label>经验</label>
          <input class="input" id="fExperience" placeholder="如 5年" />
        </div>
      </div>
      <div class="field">
        <label>备注</label>
        <textarea class="textarea" id="fNote" style="min-height:60px" placeholder="其他信息"></textarea>
      </div>
      <div class="field" id="fCollectedAtRow" style="display:none">
        <label>入库时间</label>
        <input class="input" id="fCollectedAt" disabled />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="editCancel">取消</button>
        <button class="btn btn-primary" id="editSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认删除弹窗 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="modal-body" style="text-align:center;padding:24px">
        <div style="font-size:15px;font-weight:500;margin-bottom:16px" id="confirmMessage">确定要删除吗？</div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button class="btn btn-secondary" id="confirmCancel">取消</button>
          <button class="btn btn-danger" id="confirmOk">确定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none"></div>

  <script src="js/talent-pool.js"></script>
</body>
</html>
