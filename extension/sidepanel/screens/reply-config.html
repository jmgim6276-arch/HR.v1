<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大模型判断配置</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); display: none;
      align-items: center; justify-content: center; z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--bg); width: 90%; max-width: 420px;
      max-height: 90vh; border-radius: var(--radius-lg);
      display: flex; flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden;
    }
    .modal-header {
      padding: 16px; border-bottom: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .modal-footer {
      padding: 16px; border-top: 1px solid var(--border-soft);
      display: flex; gap: 12px; justify-content: flex-end;
    }
    .connected-badge {
      font-size: 11px; color: var(--success);
      background: color-mix(in srgb, var(--success), transparent 90%);
      padding: 2px 8px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="panel-content">
    <div class="row-between" style="margin-bottom:16px">
      <h2 class="section-title" style="margin:0">大模型配置</h2>
      <span class="connected-badge" id="connStatus" style="display:none">Connected</span>
    </div>

    <div class="field">
      <label>API 地址</label>
      <input type="text" class="input" id="apiUrl" placeholder="https://api.deepseek.com">
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" class="input" id="apiKey" placeholder="sk-...">
    </div>
    <div class="field">
      <label>模型名称</label>
      <input type="text" class="input" id="modelName" value="deepseek-v4-flash">
    </div>
    <div class="field">
      <label>调用大模型时保留的对话轮次</label>
      <input type="number" class="input" id="maxHistoryRounds" value="20" min="1" max="200">
      <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5">
        说明：控制每次调用大模型时发送的最近消息数量。轮次越大，消耗的 Token 越多，上下文窗口占用越大。
        建议根据实际对话长度和大模型上下文限制合理设置，一般 10~30 轮足以覆盖大多数对话场景。
      </div>
    </div>

    <div class="field">
      <label>通用知识库（公司信息、制度、FAQ 等）</label>
      <textarea class="textarea" id="generalKnowledgeBase" style="min-height:120px" placeholder="输入通用公司信息、制度规定、常见问题等，将作为大模型对话的背景知识。系统提示词已内置，无需重复配置。"></textarea>
      <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5">
        此处配置的内容将作为所有岗位对话的通用背景知识传递给大模型。岗位专有的知识请在「岗位配置」中填写。
      </div>
    </div>

    <div class="field">
      <label>用户提示词（自定义指令）</label>
      <textarea class="textarea" id="userPrompt" style="min-height:80px" placeholder="输入您希望大模型遵循的额外指令，如：请优先推荐公司福利、多说公司优势等。将拼接到系统提示词末尾，覆盖所有对话。"></textarea>
      <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5">
        此处配置的内容将作为额外的指令追加到系统提示词末尾，影响大模型在所有对话中的行为表现。
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:4px; margin-bottom:20px">
      <button class="btn btn-secondary" style="flex:1" id="btnTestConn">测试连通性</button>
    </div>
    <div style="font-size:12px; color:var(--muted); margin-top:-12px; margin-bottom:16px" id="testResult"></div>

  </div>


  <!-- Toast -->
  <div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none"></div>

  <script src="js/reply-config.js"></script>
</body>
</html>
