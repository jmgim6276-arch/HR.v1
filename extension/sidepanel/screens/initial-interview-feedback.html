<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>初面反馈</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .page-title { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
    .page-note { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .connection { display: inline-flex; align-items: center; gap: 6px; margin-top: 1px; padding: 5px 9px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 11px; white-space: nowrap; }
    .connection::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--meta); }
    .connection.connected { color: var(--success); }
    .connection.connected::before { background: var(--success); }
    .connection.error { color: var(--danger); }
    .connection.error::before { background: var(--danger); }

    .summary-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .summary-card { border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 11px 12px; background: var(--surface-warm); }
    .summary-number { font-family: var(--font-mono); font-size: 18px; font-weight: 650; line-height: 1.2; }
    .summary-label { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
    .toolbar .input { flex: 1; min-width: 0; }
    .filter-select { height: 38px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); font: inherit; font-size: 12px; }
    .filter-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .refresh-btn { height: 38px; padding: 0 13px; font-size: 12px; }

    .feedback-list { display: flex; flex-direction: column; gap: 10px; }
    .feedback-card { border: 1px solid var(--border-soft); border-radius: var(--radius-md); background: var(--bg); overflow: hidden; }
    .feedback-main { padding: 14px; }
    .feedback-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .candidate-name { margin: 0; font-size: 15px; font-weight: 650; }
    .candidate-meta { margin-top: 4px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .status { flex: none; padding: 4px 9px; border-radius: 999px; color: var(--muted); background: var(--surface); font-size: 10px; font-weight: 600; }
    .status.received { color: var(--success); background: color-mix(in srgb, var(--success) 11%, transparent); }
    .status.failed { color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, transparent); }
    .call-strip { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 11px; padding: 9px 10px; border-radius: 8px; background: var(--surface); color: var(--fg-2); font-size: 11px; }
    .call-strip b { color: var(--fg); font-weight: 600; }
    .feedback-summary { margin: 11px 0 0; color: var(--fg-2); font-size: 12px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .waiting-copy { margin-top: 11px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .failed-copy { color: var(--danger); }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin-top: 12px; }
    .field { min-width: 0; margin: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field-label { color: var(--meta); font-size: 10px; }
    .field-value { margin-top: 3px; color: var(--fg); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .data-tag { max-width: 100%; padding: 3px 7px; border-radius: 6px; background: var(--accent-bg); color: var(--accent); font-size: 10px; overflow-wrap: anywhere; }
    .record-link { display: inline-flex; margin-top: 10px; font-size: 11px; color: var(--accent); text-decoration: none; }
    .record-link:hover { text-decoration: underline; }
    .details { border-top: 1px solid var(--border-soft); }
    .details summary { cursor: pointer; padding: 10px 14px; color: var(--muted); font-size: 11px; list-style: none; }
    .details summary::-webkit-details-marker { display: none; }
    .details summary::after { content: "展开"; float: right; color: var(--accent); }
    .details[open] summary::after { content: "收起"; }
    .details-body { padding: 0 14px 14px; }
    .chat-list { display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }
    .chat-line { padding: 8px 9px; border-radius: 8px; background: var(--surface); font-size: 11px; line-height: 1.55; }
    .chat-role { margin-right: 6px; color: var(--accent); font-weight: 600; }
    .empty-state { padding: 34px 18px; border: 1px dashed var(--border); border-radius: var(--radius-md); text-align: center; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .empty-title { margin-bottom: 4px; color: var(--fg-2); font-size: 13px; font-weight: 600; }
    .loading-line { height: 112px; border-radius: var(--radius-md); background: linear-gradient(90deg, var(--surface) 25%, #fff 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .loading-line { animation: none; } }
    @media (max-width: 620px) {
      .page-head { align-items: stretch; flex-direction: column; gap: 8px; }
      .connection { align-self: flex-start; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar .input, .filter-select, .refresh-btn { width: 100%; }
      .field-grid { grid-template-columns: 1fr; }
      .field.wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="panel-content">
    <header class="page-head">
      <div>
        <h1 class="page-title">初面反馈</h1>
        <p class="page-note">展示呼波特电话初面结果、意向判断、通话摘要及聊天记录。</p>
      </div>
      <span class="connection" id="connectionState">正在检测接口</span>
    </header>

    <section class="summary-row" aria-label="初面反馈统计">
      <div class="summary-card"><div class="summary-number" id="countReceived">0</div><div class="summary-label">已收到反馈</div></div>
      <div class="summary-card"><div class="summary-number" id="countWaiting">0</div><div class="summary-label">等待初面</div></div>
      <div class="summary-card"><div class="summary-number" id="countFailed">0</div><div class="summary-label">提交失败</div></div>
    </section>

    <div class="toolbar">
      <input class="input" id="searchInput" placeholder="搜索姓名 / 电话 / 岗位 / 摘要" aria-label="搜索初面反馈" />
      <select class="filter-select" id="statusFilter" aria-label="按反馈状态筛选">
        <option value="all">全部状态</option>
        <option value="received">已收到反馈</option>
        <option value="waiting">等待初面</option>
        <option value="failed">提交失败</option>
      </select>
      <button class="btn btn-secondary refresh-btn" id="refreshButton">刷新</button>
    </div>

    <section class="feedback-list" id="feedbackList" aria-live="polite">
      <div class="loading-line"></div>
      <div class="loading-line"></div>
    </section>
  </main>

  <div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:9px 18px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none"></div>
  <script src="js/initial-interview-feedback.js"></script>
</body>
</html>
