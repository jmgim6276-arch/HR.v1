<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>岗位配置</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    .job-list { display: flex; flex-direction: column; gap: 10px; }
    .job-item { background: var(--surface); border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--border-soft); transition: border-color 0.2s; }
    .job-item:hover { border-color: var(--border); }
    .job-item.inactive { opacity: 0.7; }
    .job-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .job-name { font-weight: 600; font-size: 15px; }

    .status-toggle { position: relative; display: inline-block; width: 32px; height: 18px; }
    .status-toggle input { opacity: 0; width: 0; height: 0; }
    .status-toggle .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border); transition: .2s; border-radius: 18px; }
    .status-toggle .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .2s; border-radius: 50%; }
    .status-toggle input:checked + .slider { background-color: var(--success); }
    .status-toggle input:checked + .slider:before { transform: translateX(14px); }

    .job-actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 8px; border-top: 1px solid var(--border-soft); }
    .action-icon { color: var(--muted); cursor: pointer; font-size: 12px; }
    .action-icon:hover { color: var(--fg); }
    .action-icon.danger:hover { color: var(--danger); }
    .action-icon.info:hover { color: var(--accent); }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal { background: var(--bg); width: 90%; max-width: 340px; border-radius: var(--radius-lg); padding: 20px; }
  </style>
</head>
<body>
  <div class="panel-content">
    <div class="action-bar">
      <h3 style="font-size:15px;font-weight:600;margin:0" id="jobTitle">岗位配置</h3>
      <button class="btn btn-primary" style="font-size:12px;padding:6px 14px" id="btnAddJob">+ 新增岗位配置</button>
    </div>
    <div class="job-list" id="jobList"></div>
    <div id="emptyState" style="text-align:center;padding:40px 20px;color:var(--muted);display:none">
      <div style="font-size:40px;margin-bottom:12px;opacity:0.4">💼</div>
      <p style="margin:0">暂无岗位配置</p>
      <p style="font-size:12px;margin-top:6px">点击上方按钮新增岗位配置</p>
    </div>
  </div>

  <!-- 确认删除弹窗 -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <div class="modal-body" style="text-align:center;padding:24px">
        <div style="font-size:15px;font-weight:500;margin-bottom:16px" id="confirmMessage">确定要删除吗？</div>
        <div style="display:flex;gap:12px;justify-content:center">
          <button class="btn btn-secondary" id="confirmCancel">取消</button>
          <button class="btn btn-danger" id="confirmOk">确定删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none"></div>

  <script src="js/job-list.js"></script>
</body>
</html>
